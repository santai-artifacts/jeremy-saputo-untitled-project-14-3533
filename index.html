<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .game-wrapper {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: inline-block;
        }

        canvas {
            display: block;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            border: 3px solid #667eea;
            margin-bottom: 1.5rem;
        }

        .info {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .score-box {
            color: #667eea;
        }

        .highscore-box {
            color: #764ba2;
        }

        .controls {
            margin-bottom: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .controls p {
            margin: 0.5rem 0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
        }

        .game-over.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .game-over h2 {
            font-size: 2rem;
            color: #764ba2;
            margin-bottom: 1rem;
        }

        .game-over p {
            font-size: 1.5rem;
            color: #667eea;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake</h1>
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="info">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="highscore-box">High Score: <span id="highscore">0</span></div>
            </div>
            <div class="controls">
                <p>Use arrow keys to move</p>
                <p>Space to pause/resume</p>
            </div>
            <button id="startBtn">Start Game</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p id="finalScore">Score: 0</p>
        <button onclick="startNewGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop;

        const startBtn = document.getElementById('startBtn');
        const scoreSpan = document.getElementById('score');
        const highscoreSpan = document.getElementById('highscore');
        const gameOverModal = document.getElementById('gameOver');
        const overlay = document.getElementById('overlay');
        const finalScoreSpan = document.getElementById('finalScore');

        let highScore = localStorage.getItem('snakeHighScore') ? parseInt(localStorage.getItem('snakeHighScore')) : 0;
        highscoreSpan.textContent = highScore;

        function generateFood() {
            let newFood;
            let foodOnSnake;
            do {
                foodOnSnake = false;
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);
            return newFood;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = 'rgba(255, 107, 107, 0.5)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#4ecdc4';
                    ctx.shadowColor = 'rgba(78, 205, 196, 0.6)';
                    ctx.shadowBlur = 10;
                } else {
                    // Body
                    ctx.fillStyle = `hsl(174, 70%, ${50 + index * 1}%)`;
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });
            ctx.shadowBlur = 0;
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreSpan.textContent = score;
                food = generateFood();
            } else {
                snake.pop();
            }
        }

        function gameLoopFn() {
            if (gameRunning && !gamePaused) {
                update();
                draw();
            }
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highscoreSpan.textContent = highScore;
            }

            finalScoreSpan.textContent = `Score: ${score}`;
            gameOverModal.classList.add('show');
            overlay.classList.add('show');
            startBtn.textContent = 'Start Game';
        }

        function startNewGame() {
            snake = [{x: 10, y: 10}];
            food = generateFood();
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            gamePaused = false;
            scoreSpan.textContent = score;
            gameRunning = true;
            gameOverModal.classList.remove('show');
            overlay.classList.remove('show');
            startBtn.textContent = 'Pause';
            gameLoop = setInterval(gameLoopFn, 100);
            draw();
        }

        startBtn.addEventListener('click', () => {
            if (!gameRunning) {
                startNewGame();
            } else {
                gamePaused = !gamePaused;
                startBtn.textContent = gamePaused ? 'Resume' : 'Pause';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            if (e.code === 'Space') {
                e.preventDefault();
                gamePaused = !gamePaused;
                startBtn.textContent = gamePaused ? 'Resume' : 'Pause';
                return;
            }

            // Prevent going backwards into itself
            if (e.key === 'ArrowUp' && dy === 0) {
                nextDx = 0;
                nextDy = -1;
                e.preventDefault();
            } else if (e.key === 'ArrowDown' && dy === 0) {
                nextDx = 0;
                nextDy = 1;
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' && dx === 0) {
                nextDx = -1;
                nextDy = 0;
                e.preventDefault();
            } else if (e.key === 'ArrowRight' && dx === 0) {
                nextDx = 1;
                nextDy = 0;
                e.preventDefault();
            }
        });

        draw();
    </script>
</body>
</html>
